onboarding = false
# herdr configuration
# ~/.config/herdr/config.toml へシンボリックリンク

[keys]
rename_tab = "prefix+r"
resize_mode = ""

[theme]
name = "terminal"

[theme.custom]
accent = "#58a6ff"
sidebar_bg = "#161b22"
active_row_bg = "#21262d"
selection_bg = "#1f6feb"

[ui]
window_title = "{pane} — {hostname}"

[ui.toast]
delivery = "terminal"

[ui.sidebar.agents]
rows = [["state_icon", "pane", "tab"], ["workspace"]]
