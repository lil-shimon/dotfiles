onboarding = false
# herdr configuration
# ~/.config/herdr/config.toml へシンボリックリンク

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle herdr-reviewr sidebar"

[theme]
name = "terminal"
auto_switch = false

[ui]
# 外側のターミナルのウィンドウタイトル。{pane} は herdr-agent-name.sh が
# プロンプト先頭から付けるペイン名。
window_title = "{pane} — {hostname}"

[ui.toast]
delivery = "terminal"
