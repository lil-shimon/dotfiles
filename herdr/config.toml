onboarding = false
# herdr configuration
# ~/.config/herdr/config.toml へシンボリックリンク

[keys]
rename_tab = "prefix+r"
resize_mode = ""

[[keys.command]]
key = "prefix+a"
type = "popup"
command = "exec \"$HOME/dotfiles/herdr/reviewr-worktree.sh\""
description = "toggle herdr-reviewr sidebar for a chosen worktree"
width = "70%"
height = "50%"

[theme]
name = "terminal"

[theme.custom]
accent = "#e95420"
sidebar_bg = "#2c001e"
active_row_bg = "#5e2750"
selection_bg = "#77216f"

[ui]
window_title = "{pane} — {hostname}"

[ui.toast]
delivery = "terminal"

[ui.sidebar.agents]
rows = [["state_icon", "pane", "tab"], ["workspace"]]
